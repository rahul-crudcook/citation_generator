name: "CI/CD: self-hosted deploy"

on:
  push:
    branches:
      - Milestones

jobs:
  deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure rsync exists
        run: |
          if ! command -v rsync >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y rsync
          fi

      - name: Ensure target directory exists
        run: |
          sudo mkdir -p "${{ secrets.EC2_APP_DIR }}"
          sudo chown -R "$USER":"$USER" "${{ secrets.EC2_APP_DIR }}"

      - name: Sync code to app dir
        run: |
          rsync -a --delete --exclude '.git' ./ "${{ secrets.EC2_APP_DIR }}/"

      - name: Write environment file (.env)
        working-directory: ${{ secrets.EC2_APP_DIR }}
        run: |
          cat > .env <<'EOF'
          APP_NAME=${{ secrets.APP_NAME }}
          ENV=${{ secrets.ENV }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          JWT_ALG=${{ secrets.JWT_ALG }}
          ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          REFRESH_TOKEN_EXPIRE_MINUTES=${{ secrets.REFRESH_TOKEN_EXPIRE_MINUTES }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          EOF

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create venv & install deps
        working-directory: ${{ secrets.EC2_APP_DIR }}
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install .

      - name: Run Alembic migrations
        working-directory: ${{ secrets.EC2_APP_DIR }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          source venv/bin/activate
          alembic upgrade head

      - name: Restart service if present
        run: |
          if systemctl is-enabled --quiet citation.service; then
            sudo systemctl restart citation.service
            sudo systemctl status citation.service --no-pager -l || true
          else
            echo "ℹ️ systemd service 'citation.service' not found. Create/enable it to auto-start."
          fi
