# ===========================
# Alembic configuration file
# ===========================

[alembic]
# Path to the migrations package
script_location = migrations

# Read the DB URL from the environment at runtime, e.g.:
#   export DATABASE_URL="postgresql+psycopg://user:pass@localhost:5432/citations"
sqlalchemy.url = %(DATABASE_URL)s

# Naming for autogenerated migration files: "<rev>_<slug>.py"
file_template = %(rev)s_%(slug)s
truncate_slug_length = 40

# Where version files live (single location)
version_locations = migrations/versions

# ---------------------------
# Logging configuration
# ---------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
# Use the "ext://" form so no Python imports are needed here
args = (ext://sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
