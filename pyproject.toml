[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citation-generator"
version = "0.1.0"
requires-python = ">=3.11"
description = "Backend for citation generator"
readme = "README.md"
authors = [{ name = "You" }]
dependencies = [
  # Web & ASGI
  "fastapi>=0.111.0,<1",
  "uvicorn[standard]>=0.30.0,<1",

  # Data & DB
  "SQLAlchemy>=2.0.30,<3",
  "sqlmodel>=0.0.19,<0.1",
  "psycopg[binary]>=3.1.12,<4",
  "alembic>=1.13.2,<2",

  # Validation & Settings
  "pydantic>=2.7.0,<3",
  "pydantic-settings>=2.2.1,<3",
  "email-validator>=2.1.0",

  # Auth (JWT + hashing + forms)
  "python-jose[cryptography]>=3.3.0,<4",
  "passlib[bcrypt]>=1.7.4,<2",
  "bcrypt>=4.1.2,<5",
  "python-multipart>=0.0.9",

  # Google OAuth (stateless)
  "Authlib>=1.3.0,<2",

  # HTTP client
  "httpx>=0.27.0,<1",

  # Export formats
  "python-docx>=1.1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=24.4",
  "ruff>=0.4.2",
  "pylint>=3.2.2",
  "mypy>=1.10.0",
  "types-requests",
]

# If you later want real console scripts, use this format:
# [project.entry-points."console_scripts"]
# serve = "uvicorn.__main__:main"  # example only; better to keep Makefile tasks

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","I","UP","B","C90"]
ignore = ["E203"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.pylint.MASTER]
ignore = ["migrations", "tests", "scripts"]
extension-pkg-allow-list = ["pydantic"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "R0903",
  "C0114",
  "C0116",
]

[tool.pylint.BASIC]
module-rgx = "(([a-z_][a-z0-9_]*)|([0-9]{8}_[0-9]{4}_[a-z0-9_]+))$"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

# Alembic reads this block; keep percent signs doubled so Alembic can expand them later.
[tool.alembic]
script_location = "migrations"
# must be a list, not a boolean
prepend_sys_path = ["."]
version_locations = ["migrations/versions"]
truncate_slug_length = 40
# escape % so Alembic can expand later
file_template = "%%(rev)s_%%(slug)s"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["migrations*", "tests*", "scripts*", "docs*"]
