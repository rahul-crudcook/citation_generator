[alembic]
script_location = migrations
version_locations = migrations/versions
# Escape % for ConfigParser
file_template = %%(rev)s_%%(slug)s
# Either remove this line OR make it a list-like literal to satisfy slicing:
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
# DO NOT use ext:// with fileConfig; it causes a SyntaxError
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
