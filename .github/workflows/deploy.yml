name: Deploy to EC2 (self-hosted)

on:
  push:
    branches: [ Milestones ]

jobs:
  deploy:
    runs-on: [self-hosted, ec2, linux]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure app dir & sync code
        run: |
          mkdir -p "${{ secrets.EC2_APP_DIR }}"
          rsync -a --delete ./ "${{ secrets.EC2_APP_DIR }}/"

      - name: Write .env from GitHub Secrets
        run: |
          cat > "${{ secrets.EC2_APP_DIR }}/.env" <<'EOF'
          APP_NAME=${{ secrets.APP_NAME }}
          ENV=${{ secrets.ENV }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          JWT_ALG=${{ secrets.JWT_ALG }}
          ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          REFRESH_TOKEN_EXPIRE_MINUTES=${{ secrets.REFRESH_TOKEN_EXPIRE_MINUTES }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
          EOF
          chmod 600 "${{ secrets.EC2_APP_DIR }}/.env"

      - name: Create/activate venv & install deps
        working-directory: ${{ secrets.EC2_APP_DIR }}
        run: |
          python3 -m venv venv || true
          . venv/bin/activate
          pip install --upgrade pip
          pip install .
      
      - name: Run Alembic migrations
        working-directory: ${{ secrets.EC2_APP_DIR }}
        run: |
          . venv/bin/activate
          alembic upgrade head

      - name: Restart FastAPI service
        run: sudo systemctl restart citation.service || true
